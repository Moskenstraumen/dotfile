[mgr]
show_hidden = true

[opener]
edit = [
  { run = "nvim %s", desc = "nvim", block = true, for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-ndjson", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { mime = "application/yaml", use = "edit" },
  { mime = "application/xml", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.sh", use = "edit" },
  { url = "*.zsh", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.json", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
]
