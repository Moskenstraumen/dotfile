# herdr on a remote box (login node, VPS, container).
#
# Presentation settings — [theme], [keys], [ui], copy behaviour — come from the
# *client's* local config, so they are deliberately absent here: the macOS
# config.local.toml already drives the UI over `herdr --remote`, and duplicating
# it would be two copies to keep in sync.
#
# Only settings that belong to the server where the panes actually run live in
# this file. herdr man page, "Configuration": pane defaults, worktrees,
# integrations and custom commands are server-side; themes and keybindings are
# client-side.

[terminal]
# Redundant where the bootstrap could chsh: sshd then sets SHELL to zsh and
# herdr falls back to $SHELL anyway. It matters on boxes that rely on the
# ~/.profile hand-off. `herdr --remote` starts the server from a
# non-interactive ssh command, so SHELL is still /bin/bash, and panes start as
# non-login shells, so the hand-off never fires and every pane would be bash.
# A name rather than a path, so a static zsh in ~/.local/bin works as well as
# a system one.
default_shell = "zsh"

[server]
# Wider than the 120x40 default: when no client is attached the server lays
# panes out at this size, and agent output wrapping badly on a narrow virtual
# terminal is hard to read back later.
headless_cols = 160
headless_rows = 50
